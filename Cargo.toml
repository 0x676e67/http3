[workspace]
members = [
    "http3",
    "http3-quinn",
    "http3-webtransport",
    "http3-datagram",

    # Internal
    "examples",
    "interop",
    "interop/crates/nghttp3-sys",
    "interop/crates/ngtcp2",
    "interop/crates/ngtcp2-sys",
    "interop/crates/tokio-ngtcp2",
]
default-members = [
    "http3",
    "http3-quinn",
    "http3-webtransport",
    "http3-datagram",
    "examples",
]
exclude = [
  "fuzz",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/0x676e67/http3-rs"

[workspace.dependencies]
http3-datagram-rs = { version = "0.0.2", path = "http3-datagram" }
http3-quinn-rs = { version = "0.0.10", path = "http3-quinn" }
http3-rs = { version = "0.0.8", path = "http3" }
http3-webtransport-rs = { version = "0.1.2", path = "http3-webtransport" }

# Internal
ngtcp2-sys = { version = "0.2.0", path = "interop/crates/ngtcp2-sys" }
nghttp3-sys = { version = "0.2.0", path = "interop/crates/nghttp3-sys" }
ngtcp2 = { version = "0.2.0", path = "interop/crates/ngtcp2" }
tokio-ngtcp2 = { version = "0.2.0", path = "interop/crates/tokio-ngtcp2" }

# External crates
anyhow = "1.0"
assert_matches = "1.5.0"
bytes = "1"
fastrand = "2.0.1"
futures = "0.3"
futures-util = { version = "0.3", default-features = false }
http = "1"
octets = "0.3.0"
pin-project-lite = { version = "0.2", default-features = false }
proptest = "1"
quinn = { version = "0.11", default-features = false }
quinn-proto = { version = "0.11", default-features = false }
rcgen = "=0.14.5"
rustls = { version = "0.23", default-features = false }
rustls-native-certs = "0.8"
smallvec = "1.15.0"
structopt = "0.3"
tokio = { version = "1", default-features = false }
tokio-util = "0.7.9"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3", default-features = false }
tracing-tree = "0.4"
