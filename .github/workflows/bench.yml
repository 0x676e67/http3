name: Benchmark

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  toolchain_benchmark_msrv: "1.96"

jobs:
  benchmark:
    name: Benchmark on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust ${{ env.toolchain_benchmark_msrv }}
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.toolchain_benchmark_msrv }}
          components: clippy

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libclang-dev nasm pkg-config

      - name: Check Linux launcher
        run: |
          bash -n bench/run-balanced.sh
          bash bench/run-balanced.sh --help

      - name: Lint benchmark
        run: cargo clippy -p bench --all-targets --locked -- -D warnings

      - name: Build benchmark
        run: cargo bench -p bench --bench clients --no-run --locked
        env:
          RUSTFLAGS: "-D warnings"

      - name: List benchmark cases through Linux launcher
        working-directory: ${{ runner.temp }}
        run: |
          for headers in none request response both; do
            output=$(bash "$GITHUB_WORKSPACE/bench/run-balanced.sh" \
              --body-sizes 0B,1KiB --requests 1000 --concurrency 100 \
              --headers "$headers" -- --list)
            printf '%s\n' "$output"
            expected=$(for body in '0 B' '1 KiB'; do
              for server in http3 h3; do
                for client in http3 h3 nghttp3; do
                  printf '%s/%s/server-%s/requests-1000/concurrency-100/headers-%s: benchmark\n' \
                    "$client" "$body" "$server" "$headers"
                done
              done
            done)
            actual=$(printf '%s\n' "$output" | grep ': benchmark$')
            test "$actual" = "$expected"
          done
        env:
          RUSTFLAGS: "-D warnings"

      - name: Smoke clients against both Servers
        timeout-minutes: 5
        run: |
          for headers in none request response both; do
            bash bench/run-balanced.sh \
              --body-sizes 0B,1KiB --requests 4 --concurrency 2 \
              --headers "$headers" -- --test
          done
        env:
          RUSTFLAGS: "-D warnings"

      - name: Compare header directions and body sizes
        run: |
          # 4 body sizes x 2 concurrency levels x 4 header modes x 2 Servers x
          # 3 Clients = 192 cases. Criterion may exceed its 3-second target
          # to collect 10 samples; 1000 requests per iteration bounds each batch.
          for concurrency in 1 100; do
            for headers in none request response both; do
              echo "Headers: $headers; concurrency: $concurrency"
              bash bench/run-balanced.sh \
                --body-sizes 0B,1KiB,10KiB,100KiB \
                --requests 1000 --concurrency "$concurrency" --headers "$headers" \
                -- --sample-size 10 --measurement-time 3 --warm-up-time 1 --noplot
            done
          done
        env:
          RUSTFLAGS: "-D warnings"
