name: Release-plz

on:
  push:
    branches:
      - main

jobs:
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    if: ${{ github.repository == '0x676e67/http3' }}
    outputs:
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
    permissions:
      contents: write
      id-token: write
      pull-requests: read
    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - &install-rust
        name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      # A crates.io publish cannot be undone, and `release-plz release` uploads
      # the workspace one crate at a time. A manifest error found partway
      # through leaves the earlier crates published at the new version and the
      # rest behind, which can only be resolved by burning another version.
      # Package every publishable crate first so that class of error fails the
      # job before anything is uploaded. Sibling versions resolve from the
      # workspace here, so this works even though none of them is published yet.
      - name: Verify publishable crates
        run: cargo package -p http3 -p http3-datagram -p http3-quic --no-verify --locked
      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  release-plz-pr:
    name: Release-plz PR
    # Serialised behind the release job. Run in parallel, this job can open the
    # version bump and changelog pull request while the release job is already
    # publishing, so a release gets built from a commit whose changelog entry
    # has not landed yet. Skipped entirely when the release job published
    # something: the next push to main opens the pull request.
    needs: release-plz-release
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.repository == '0x676e67/http3' &&
        needs.release-plz-release.result == 'success' &&
        needs.release-plz-release.outputs.releases_created == 'false'
      }}
    permissions:
      pull-requests: write
      contents: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - *checkout
      - *install-rust
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
