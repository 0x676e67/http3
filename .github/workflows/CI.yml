name: CI
on:
  pull_request:
  push:
    branches:
      - main

env:
  RUST_BACKTRACE: 1
  core_package_args: >-
    --workspace
    --exclude interop
    --exclude http3-bench
  toolchain_style: nightly
  toolchain_msrv: "1.85"
  toolchain_http3_quinn_msrv: "1.85"
  toolchain_doc: nightly
  toolchain_lint: stable
  toolchain_fuzz: nightly
  toolchain_benchmark_msrv: "1.96"

jobs:
  ci-pass:
    name: CI is green
    runs-on: ubuntu-latest
    needs:
      - style
      - lint
      - benchmark
      - msrv
      - msrv_http3_quic
      - test
      - doc
      - fuzz
      - examples
      # Compliance reporting is temporarily disabled until its publishing setup is repaired.
      # - compliance
    steps:
      - run: exit 0

  style:
    name: Check Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust ${{ env.toolchain_style }}
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.toolchain_style }}
          components: rustfmt
      - run: cargo +${{ env.toolchain_style }} fmt --all --check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust ${{ env.toolchain_lint }}
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.toolchain_lint }}
          components: clippy
      - run: cargo clippy ${{ env.core_package_args }}

  benchmark:
    name: Build benchmark on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Rust ${{ env.toolchain_benchmark_msrv }}
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.toolchain_benchmark_msrv }}
          components: clippy
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libclang-dev nasm pkg-config
      - name: Check Linux launcher
        if: runner.os == 'Linux'
        run: |
          bash -n bench/run-balanced.sh
          bash bench/run-balanced.sh --help
      - name: Check Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path bench/run-balanced.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }
          Get-Help ./bench/run-balanced.ps1 -Full | Out-String | Write-Host
      - name: Lint benchmark
        if: runner.os == 'Linux'
        run: cargo clippy -p http3-bench --all-targets --locked -- -D warnings
      - name: Build benchmark
        run: cargo bench -p http3-bench --bench clients --no-run --locked
        env:
          RUSTFLAGS: "-D warnings"
      - name: List benchmark cases through Linux launcher
        if: runner.os == 'Linux'
        working-directory: ${{ runner.temp }}
        run: |
          output=$(bash "$GITHUB_WORKSPACE/bench/run-balanced.sh" \
            --topologies 1/1 \
            --body-sizes 0B \
            -- --list)
          printf '%s\n' "$output"
          expected=$(printf '%s\n' \
            'http3-client/post-local-setup-to-last-complete-response/1-connection-1-socket/0 B/http3: benchmark' \
            'http3-client/post-local-setup-to-last-complete-response/1-connection-1-socket/0 B/h3: benchmark' \
            'http3-client/post-local-setup-to-last-complete-response/1-connection-1-socket/0 B/nghttp3: benchmark')
          actual=$(printf '%s\n' "$output" | grep ': benchmark$')
          test "$actual" = "$expected"
        env:
          RUSTFLAGS: "-D warnings"
      - name: List benchmark cases through Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $output = @(& (Join-Path $env:GITHUB_WORKSPACE 'bench/run-balanced.ps1') `
            -Topologies '1/1' `
            -BodySizes '0B' `
            -CriterionArgs @('--list'))
          $output | Write-Host
          $actual = @($output | Where-Object { $_ -match ': benchmark$' })
          $expected = @(
            'http3-client/post-local-setup-to-last-complete-response/1-connection-1-socket/0 B/http3: benchmark'
            'http3-client/post-local-setup-to-last-complete-response/1-connection-1-socket/0 B/h3: benchmark'
            'http3-client/post-local-setup-to-last-complete-response/1-connection-1-socket/0 B/nghttp3: benchmark'
          )
          if (($actual -join "`n") -ne ($expected -join "`n")) {
            throw "Unexpected benchmark list:`n$($actual -join "`n")"
          }
        env:
          RUSTFLAGS: "-D warnings"

  msrv:
    name: Check MSRV
    needs: [style]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust ${{ env.toolchain_msrv }}
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.toolchain_msrv }}
      - run: cargo check -p http3

  msrv_http3_quic:
    name: Check MSRV of `http3-quic`
    needs: [style]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust ${{ env.toolchain_http3_quinn_msrv }}
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.toolchain_http3_quinn_msrv }}
      - run: cargo check -p http3-quic

  test:
    name: Test ${{ matrix.toolchain }} ${{ matrix.os }} ${{ matrix.target }}
    needs: [style]
    strategy:
      matrix:
        os: [ubuntu-latest]
        toolchain: [stable, beta]
        features: [unstable, tracing, "tracing,unstable"]
        target: [x86_64-unknown-linux-gnu]
        include:
          # Add a 32-bit target test configuration
          - os: ubuntu-latest
            toolchain: stable
            features: unstable
            target: i686-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Add this step for 32-bit build support
      - name: Install 32-bit development libraries
        if: matrix.target == 'i686-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib libc6-dev-i386 libclang-dev
      - name: Install Rust ${{ matrix.toolchain }}
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          target: ${{ matrix.target }}
      - run: cargo test ${{ env.core_package_args }} --features ${{ matrix.features }} --target ${{ matrix.target }}
        env: #[cfg(feature = "datagram")] unexpected `cfg` condition value: `datagram`
          RUSTFLAGS: "-A unexpected_cfgs"
      - name: h3Spec
        run: ./ci/h3spec.sh
        if: matrix.toolchain == 'stable'

  doc:
    name: Build docs
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust ${{ env.toolchain_doc }}
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.toolchain_doc }}
      - run: cargo rustdoc -p http3 -- -D rustdoc::broken_intra_doc_links -D warnings

  fuzz:
    name: Fuzz test
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust ${{ env.toolchain_fuzz }}
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.toolchain_fuzz }}
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: cargo fuzz run fuzz_varint -- -runs=1

  # Compliance reporting is temporarily disabled because its publishing workflow is not stable.
  # compliance:
  #   name: Compliance report
  #   needs: [test]
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v7
  #       with:
  #         persist-credentials: false
  #         fetch-depth: 0
  #     - name: Generate compliance report
  #       uses: ./.github/actions/compliance
  #       with:
  #         report-script: ${{ github.workspace }}/ci/compliance/report.sh

  examples:
    name: Run Examples
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Run server and client examples test
        run: ./ci/example_test.sh
