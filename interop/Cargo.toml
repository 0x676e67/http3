[package]
name = "interop"
version = "0.0.0"
publish = false
rust-version = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }

[dependencies]
bytes = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
http3 = { workspace = true, features = ["tracing"] }
http3-quic = { workspace = true, features = ["tracing"] }
quic = { workspace = true, features = [
    "runtime-tokio",
    "rustls",
    "ring",
] }
rcgen = { workspace = true }
rustls = { workspace = true, features = [
    "logging",
    "ring",
    "std",
] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
tokio = { workspace = true, features = ["full"] }

[dev-dependencies]
h3 = { version = "0.0.8", features = [
    "i-implement-a-third-party-backend-and-opt-into-breaking-changes",
    "tracing",
] }
quinn = { workspace = true, features = [
    "runtime-tokio",
    "rustls",
    "ring",
] }
ngtcp2 = { workspace = true }
h3-quinn = { version = "0.0.10", features = ["tracing"] }
rustls-native-certs = { workspace = true }
tempfile = "3"
tokio-quiche = { version = "0.20.1", default-features = false }
tquic = "1.6"
tokio-ngtcp2 = { workspace = true }
