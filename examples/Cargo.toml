[package]
name = "examples"
version = "0.0.0"
publish = false
rust-version = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }

# If you copy one of the examples into a new project, you should be using
# [dependencies] instead.
[dev-dependencies]
anyhow = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
http3-rs = { workspace = true, features = ["tracing"] }
http3-quinn-rs = { workspace = true, features = ["tracing", "datagram"] }
http3-webtransport-rs = { workspace = true }
http = { workspace = true }
quinn = { workspace = true, features = [
    "runtime-tokio",
    "rustls",
    "ring",
] }
rcgen = { workspace = true }
rustls = { workspace = true, features = [
    "logging",
    "ring",
    "std",
] }
rustls-native-certs = { workspace = true }
structopt = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = [
    "fmt",
    "ansi",
    "env-filter",
    "time",
    "tracing-log",
] }
octets = { workspace = true }

tracing-tree = { workspace = true }
http3-datagram-rs = { workspace = true }

[features]
tree = []

[[example]]
name = "client"
path = "client.rs"

[[example]]
name = "server"
path = "server.rs"

[[example]]
name = "webtransport_server"
path = "webtransport_server.rs"
