[package]
name = "http3-fuzz-rs"
version = "0.0.0"
authors = ["Automatically generated"]
publish = false
rust-version = { workspace = true }
edition = "2024"
repository = "https://github.com/0x676e67/http3"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bytes = "1.5"

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[workspace.package]
rust-version = "1.98"

[[bin]]
name = "fuzz_varint"
path = "fuzz_targets/fuzz_varint.rs"
test = false
doc = false
